[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "boardrunner"
dynamic = ["version"]
description = "BoardRunner: automatic firmware rehosting with learned device models, built on FastDyn"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# FastDyn is installed from the pinned submodule: pip install -e deps/fastdyn/src
dependencies = [
    "fastdyn>=1.0",
    "click>=8.1.7,<8.2.0",
    "cmsis-svd==0.6",
    "openai>=1.0.0",
    "scipy>=1.15",
    "tomli>=2.0.2; python_version < '3.11'",
]

[project.scripts]
boardrunner = "boardrunner.cli:cli"

[project.optional-dependencies]
test = ["pytest>=7.0.0"]

[tool.setuptools.dynamic]
version = { attr = "boardrunner.__version__" }

[tool.setuptools.packages.find]
include = ["boardrunner*"]

[tool.setuptools.package-data]
"boardrunner.viomapper.codegen.prompts" = ["model_rules.md"]
